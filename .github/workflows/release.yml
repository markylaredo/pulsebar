name: Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pulsebar-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: macos-15-intel
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v6

      - name: Validate release configuration
        id: release_configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.0." >&2
            exit 1
          fi

          required_secrets=(
            MACOS_CERTIFICATE
            MACOS_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            DEVELOPER_ID_APPLICATION
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_PASSWORD
          )

          configured_count=0
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -n "${!secret_name:-}" ]]; then
              configured_count=$((configured_count + 1))
            else
              missing_secrets+=("$secret_name")
            fi
          done

          if [[ "$configured_count" -eq 0 ]]; then
            echo "signing_mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not configured. Publishing an ad-hoc signed, non-notarized release."
          elif [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            printf 'Apple signing is only partially configured. Missing:' >&2
            printf ' %s' "${missing_secrets[@]}" >&2
            printf '\n' >&2
            exit 1
          else
            echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        if: steps.release_configuration.outputs.signing_mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pulsebar-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Build universal release
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -configuration Release \
            -derivedDataPath .build-release \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign release
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.release_configuration.outputs.signing_mode }}
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"

          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            codesign --force \
              --deep \
              --options runtime \
              --timestamp \
              --sign "$DEVELOPER_ID_APPLICATION" \
              "$app_path"
          else
            codesign --force --deep --sign - "$app_path"
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo -info "$app_path/Contents/MacOS/PulseBar"

      - name: Notarize release
        if: steps.release_configuration.outputs.signing_mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"
          notarization_archive="$RUNNER_TEMP/PulseBar-notarization.zip"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"
          release_directory="$GITHUB_WORKSPACE/.build-release/release"

          mkdir -p "$release_directory"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$release_directory/PulseBar.zip"
          (
            cd "$release_directory"
            shasum -a 256 PulseBar.zip > PulseBar.zip.sha256
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_MODE: ${{ steps.release_configuration.outputs.signing_mode }}
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/.build-release/release"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$release_directory/PulseBar.zip" \
              "$release_directory/PulseBar.zip.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            if [[ "$SIGNING_MODE" == "developer-id" ]]; then
              gh release create "$RELEASE_TAG" \
                "$release_directory/PulseBar.zip" \
                "$release_directory/PulseBar.zip.sha256" \
                --target "$GITHUB_SHA" \
                --title "PulseBar ${RELEASE_TAG#v}" \
                --generate-notes \
                --latest
            else
              gh release create "$RELEASE_TAG" \
                "$release_directory/PulseBar.zip" \
                "$release_directory/PulseBar.zip.sha256" \
                --target "$GITHUB_SHA" \
                --title "PulseBar ${RELEASE_TAG#v}" \
                --notes "This release is ad-hoc signed and not notarized because Apple Developer credentials were not configured. The curl installer verifies its checksum and code signature before installation." \
                --latest
            fi
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/pulsebar-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
