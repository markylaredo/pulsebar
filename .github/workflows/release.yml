name: Publish Release

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      bump:
        description: "Semantic version component to increment"
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: pulsebar-release
  queue: max

jobs:
  release:
    name: Build and publish
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15-intel
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}

    steps:
      - name: Check out the release source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine release version
        id: version
        shell: bash
        env:
          BUMP_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.bump || 'patch' }}
        run: |
          set -euo pipefail

          find_stable_tag() {
            local excluded_commit="${1:-}"
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                if [[ -n "$excluded_commit" ]] \
                  && [[ "$(git rev-list -n 1 "$tag")" == "$excluded_commit" ]]; then
                  continue
                fi
                printf '%s\n' "$tag"
                return 0
              fi
            done
            return 0
          }

          existing_tag=""
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            existing_tag="$(find_stable_tag < <(
              git tag --points-at "$GITHUB_SHA" --sort=-version:refname
            ))"
          fi

          if [[ -n "$existing_tag" ]]; then
            release_tag="$existing_tag"
            echo "Reusing $release_tag for commit $GITHUB_SHA."
          else
            excluded_commit=""
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
              # Ignore releases already created for this commit so rerunning the
              # same manual bump produces the same version instead of another one.
              excluded_commit="$GITHUB_SHA"
            fi
            latest_tag="$(find_stable_tag "$excluded_commit" < <(
              git tag --list --sort=-version:refname
            ))"
            latest_tag="${latest_tag:-v0.0.0}"

            if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Unable to parse latest stable release tag: $latest_tag" >&2
              exit 1
            fi

            major="${BASH_REMATCH[1]}"
            minor="${BASH_REMATCH[2]}"
            patch="${BASH_REMATCH[3]}"

            case "$BUMP_TYPE" in
              major)
                major=$((major + 1))
                minor=0
                patch=0
                ;;
              minor)
                minor=$((minor + 1))
                patch=0
                ;;
              patch)
                patch=$((patch + 1))
                ;;
              *)
                echo "Unsupported version bump: $BUMP_TYPE" >&2
                exit 1
                ;;
            esac

            release_tag="v${major}.${minor}.${patch}"
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "version=${release_tag#v}" >> "$GITHUB_OUTPUT"
          echo "build=$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Publishing PulseBar ${release_tag#v} (build $GITHUB_RUN_NUMBER)."

      - name: Validate release configuration
        id: release_configuration
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v1.0.0." >&2
            exit 1
          fi

          required_secrets=(
            MACOS_CERTIFICATE
            MACOS_CERTIFICATE_PASSWORD
            KEYCHAIN_PASSWORD
            DEVELOPER_ID_APPLICATION
            APPLE_ID
            APPLE_TEAM_ID
            APPLE_APP_PASSWORD
          )

          configured_count=0
          missing_secrets=()
          for secret_name in "${required_secrets[@]}"; do
            if [[ -n "${!secret_name:-}" ]]; then
              configured_count=$((configured_count + 1))
            else
              missing_secrets+=("$secret_name")
            fi
          done

          if [[ "$configured_count" -eq 0 ]]; then
            echo "signing_mode=ad-hoc" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not configured. Publishing an ad-hoc signed, non-notarized release."
          elif [[ "${#missing_secrets[@]}" -gt 0 ]]; then
            printf 'Apple signing is only partially configured. Missing:' >&2
            printf ' %s' "${missing_secrets[@]}" >&2
            printf '\n' >&2
            exit 1
          else
            echo "signing_mode=developer-id" >> "$GITHUB_OUTPUT"
          fi

      - name: Run tests
        run: |
          set -euo pipefail
          xcodebuild test \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO

      - name: Import Developer ID certificate
        if: steps.release_configuration.outputs.signing_mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          keychain_path="$RUNNER_TEMP/pulsebar-signing.keychain-db"

          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$keychain_path"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

      - name: Build universal release
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BUILD_NUMBER: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PulseBar.xcodeproj \
            -scheme PulseBar \
            -configuration Release \
            -derivedDataPath .build-release \
            ARCHS='arm64 x86_64' \
            ONLY_ACTIVE_ARCH=NO \
            MARKETING_VERSION="$RELEASE_VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO

      - name: Sign release
        shell: bash
        env:
          SIGNING_MODE: ${{ steps.release_configuration.outputs.signing_mode }}
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"

          if [[ "$SIGNING_MODE" == "developer-id" ]]; then
            codesign --force \
              --deep \
              --options runtime \
              --timestamp \
              --sign "$DEVELOPER_ID_APPLICATION" \
              "$app_path"
          else
            codesign --force --deep --sign - "$app_path"
          fi

          codesign --verify --deep --strict --verbose=2 "$app_path"
          lipo -info "$app_path/Contents/MacOS/PulseBar"

      - name: Notarize release
        if: steps.release_configuration.outputs.signing_mode == 'developer-id'
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"
          notarization_archive="$RUNNER_TEMP/PulseBar-notarization.zip"

          ditto -c -k --sequesterRsrc --keepParent "$app_path" "$notarization_archive"
          xcrun notarytool submit "$notarization_archive" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$app_path"
          xcrun stapler validate "$app_path"
          spctl --assess --type execute --verbose=2 "$app_path"

      - name: Package release
        shell: bash
        run: |
          set -euo pipefail
          app_path="$GITHUB_WORKSPACE/.build-release/Build/Products/Release/PulseBar.app"
          release_directory="$GITHUB_WORKSPACE/.build-release/release"

          mkdir -p "$release_directory"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_path" "$release_directory/PulseBar.zip"
          (
            cd "$release_directory"
            shasum -a 256 PulseBar.zip > PulseBar.zip.sha256
          )

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          SIGNING_MODE: ${{ steps.release_configuration.outputs.signing_mode }}
        run: |
          set -euo pipefail
          release_directory="$GITHUB_WORKSPACE/.build-release/release"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$release_directory/PulseBar.zip" \
              "$release_directory/PulseBar.zip.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" --latest
          else
            if [[ "$SIGNING_MODE" == "developer-id" ]]; then
              gh release create "$RELEASE_TAG" \
                "$release_directory/PulseBar.zip" \
                "$release_directory/PulseBar.zip.sha256" \
                --target "$GITHUB_SHA" \
                --title "PulseBar ${RELEASE_TAG#v}" \
                --generate-notes \
                --latest
            else
              gh release create "$RELEASE_TAG" \
                "$release_directory/PulseBar.zip" \
                "$release_directory/PulseBar.zip.sha256" \
                --target "$GITHUB_SHA" \
                --title "PulseBar ${RELEASE_TAG#v}" \
                --notes "This release is ad-hoc signed and not notarized because Apple Developer credentials were not configured. The curl installer verifies its checksum and code signature before installation." \
                --latest
            fi
          fi

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          keychain_path="$RUNNER_TEMP/pulsebar-signing.keychain-db"
          if [[ -f "$keychain_path" ]]; then
            security delete-keychain "$keychain_path"
          fi
